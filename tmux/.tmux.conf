# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# General settings
set -g mouse on
set -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set -g prefix C-s
set-option -g status-position top
# Do not set the outer terminal’s title
set -g set-titles off
# Keep tmux window names stable (optional)
set -g automatic-rename off
set -g allow-rename off

# Splits open in current dir
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# Vim-aware pane navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vimx?)$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

##### Custom Scripts #####
bind s display-popup -E "~/.config/tmuxScript/sessionizer.sh"

##### End Custom Scripts #####

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'

# rose-pine minimal config
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_host 'off'
set -g @rose_pine_user 'off'
set -g @rose_pine_directory 'off'
set -g @rose_pine_date_time ''
set -g @rose_pine_show_pane_directory 'off'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_right_separator ' <- ' 
set -g @rose_pine_left_separator ' -> ' 

run '~/.tmux/plugins/tpm/tpm'
