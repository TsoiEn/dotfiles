# ──────────────────────────────────────────────────────────────
# Defaults this config replaces (all rebound further down)
# ──────────────────────────────────────────────────────────────
unbind r      # -> reload
unbind '%'    # -> prefix+m (horizontal split)
unbind m      # was select-pane -m, now split; mark moves to M
unbind l      # was last-window, now next-window
unbind s      # was choose-tree, now sessionizer
unbind n      # free'd
unbind p      # -> pkg.sh

# ──────────────────────────────────────────────────────────────
# Terminal
# Ghostty advertises xterm-ghostty and full RGB, so tell tmux it
# can use true colour, undercurls and the system clipboard over OSC 52.
# ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc,*256col*:Tc"
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
set -g allow-passthrough on
set -g set-clipboard on
set -g extended-keys on          # kitty keyboard protocol, for C-Tab below
set-option -g default-shell $SHELL
set-option -g default-command "$SHELL -i"

# ──────────────────────────────────────────────────────────────
# General behaviour
# ──────────────────────────────────────────────────────────────
set -g history-limit 100000
set -g escape-time 10            # no lag on Escape in Neovim
set -g focus-events on           # Neovim's autoread needs these
set -g mouse on                  # off sends scroll to Ghostty, not tmux/nvim
setw -g mode-keys vi

# ──────────────────────────────────────────────────────────────
# Windows, panes, status
# ──────────────────────────────────────────────────────────────
set -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set -g set-titles off
set -g automatic-rename off
set -g allow-rename off

# ──────────────────────────────────────────────────────────────
# Prefix
# ──────────────────────────────────────────────────────────────
set -g prefix C-s
bind C-s send-prefix          # a second C-s reaches a nested tmux or app
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ──────────────────────────────────────────────────────────────
# Splits and new windows (inherit the current path)
# ──────────────────────────────────────────────────────────────
bind '"' split-window -c "#{pane_current_path}"
bind m split-window -h -c "#{pane_current_path}"   # m instead of %
bind M select-pane -m                              # -m toggles, so mark/unmark
bind c new-window -c "#{pane_current_path}"

# ──────────────────────────────────────────────────────────────
# Pane navigation — hand C-hjkl to Neovim when it's focused
# ──────────────────────────────────────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vimx?)$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# ──────────────────────────────────────────────────────────────
# Window switching
# ──────────────────────────────────────────────────────────────
bind -n C-Tab next-window           # browser-like, needs extended-keys
bind -n C-S-Tab previous-window
bind -r h previous-window           # -r: holdable after one prefix
bind -r l next-window

# ──────────────────────────────────────────────────────────────
# Popups
# tmux 3.8 defaults popup-style to an opaque grey, which hides terminal
# transparency inside display-popup. bg=default keeps the popup see-through.
# Both scripts open their own display-popup, so run-shell is all they need.
# ──────────────────────────────────────────────────────────────
set -g popup-style 'bg=default'
set -g popup-border-style 'bg=default,fg=themelightgrey'

bind s run-shell -b "~/.config/tmuxScript/sessionizer.sh"   # session picker
bind p run-shell -b "~/.config/myscripts/pkg.sh"            # package installer
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit 2>/dev/null || git status"
bind f display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "yazi 2>/dev/null || $SHELL"

# ──────────────────────────────────────────────────────────────
# Plugins
# ──────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'rose-pine/tmux'

set -g @rose_pine_variant 'main'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_host 'off'
set -g @rose_pine_user 'off'
set -g @rose_pine_directory 'off'
set -g @rose_pine_date_time ''
set -g @rose_pine_show_pane_directory 'off'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_right_separator ' <- '
set -g @rose_pine_left_separator ' -> '

run '~/.tmux/plugins/tpm/tpm'
