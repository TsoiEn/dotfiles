[portal]
terminal = "ghostty"

[ui]
start_in_grid = false       # start in grid view
grid_zoom = 1              # grid density, 0–2
folders_first = true      # mix folders and files (default true)
default_sort = "name"  # initial sort: name, modified, or size

[preview]
tab_width = 4 # tab-stop width in columns, 1–16 (default 4)

[keys]
rename = ["r", "F2"]                    # named keys work too
search_files = "ctrl+f"                 # ctrl/alt/shift modifiers
nav_right = []                          # [] removes a default binding
open_or_enter = ["enter", "l", "right"]
delete_permanently = "D"                # uppercase = shifted letter

[open]
rules = [
  { type = ["text", "code", "config", "folder"], command = "nvim", terminal = true },
]

# Colors accept #rrggbb, ansi-blue, indexed-12, none, or transparent.

[palette]
bg = "none"
chrome = "none"
chrome_alt = "none"
border = "#6f7d8d"
panel = "none"
panel_alt = "none"
surface = "none"
elevated = "none"
button_bg = "none"
button_disabled_bg = "none"
sidebar_active = "#1a2a43"
accent_soft = "none"
progress_bar = "#41a0dc"
path_bg = "none"

[preview.code]
bg = "none"
line_highlight = "none"
comment = "#6f8399"         # comments
string = "#79e7d5"          # quoted strings
keyword = "#7aaeff"         # language keywords
function = "#36d7ff"        # function names
invalid = "#ff8585"         # invalid/error tokens
