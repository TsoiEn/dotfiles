# Starship prompt — Rose Pine (main), to match Ghostty, tmux and Neovim.
#
# Shape, per line:
#   1.  directory  git  language versions  docker  clock
#   2.  ❯
# Palette is defined at the bottom; module names are starship's own, so the
# docs at https://starship.rs/config/ apply as written.
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'rose_pine'

# shortcut: a section with nothing to show still draws its thin separator
# wedge (starship's own presets have the same seam); upgrade if starship ever
# supports conditional separators in the root format.
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$python\
$golang\
$rust\
$c\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[directory]
format = "[ $path :]($style)"
truncation_length = 1
truncation_symbol = ""

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Pictures" = " "
"Development" = "󰲋 "

[git_branch]
symbol = ""
format = '[ $symbol $branch ]($style)'

[git_status]
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "fg:base bg:foam"
format = '[ $symbol( $version) ]($style)'

[bun]
symbol = ""
style = "fg:base bg:foam"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ""
style = "fg:base bg:foam"
format = '[ $symbol( $version)(\($virtualenv\)) ]($style)'

[golang]
symbol = ""
style = "fg:base bg:foam"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = "fg:base bg:foam"
format = '[ $symbol( $version) ]($style)'

[c]
symbol = " "
style = "fg:base bg:foam"
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "fg:text bg:overlay"
format = '[ $symbol $context ]($style)'

[cmd_duration]
# Only slow commands are worth a line; "took 2s" on everything is noise.
min_time = 2000
format = "[  $duration ](fg:subtle)"

[character]
success_symbol = "[❯](bold fg:pine)"
error_symbol = "[❯](bold fg:love)"
vimcmd_symbol = "[❮](bold fg:gold)"

[palettes.rose_pine]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
