"$schema" = 'https://starship.rs/config-schema.json'

# robbyrussell: ➜  dir git:(branch) ✗
format = '$character$directory($git_branch$git_status )'

[character]
format = '$symbol '
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[directory]
format = '[$path]($style) '
style = 'cyan'
truncation_length = 1
truncate_to_repo = false
truncation_symbol = ''

[git_branch]
format = '[git:\(](bold blue)[ $branch](red)'

[git_status]
# starship has no "dirty" flag, so each state is a zero-width space: invisible,
# but it makes $all_status non-empty so the group prints a single ✗
format = '[\)](blue)[($all_status ✗)](yellow)'
conflicted = '​'
deleted = '​'
modified = '​'
renamed = '​'
staged = '​'
untracked = '​'
stashed = ''
up_to_date = ''
